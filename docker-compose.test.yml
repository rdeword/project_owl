version: '3.8'

services:
  app:
    build: .
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/news_aggregator_test
      - REDIS_URL=redis://redis:6379/0
      - MAIN_BOT_TOKEN=${TEST_BOT_TOKEN}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - DEBUG=True
    depends_on:
      - db
      - redis
    networks:
      - test_network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=news_aggregator_test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    networks:
      - test_network

  redis:
    image: redis:7-alpine
    networks:
      - test_network

networks:
  test_network:
    driver: bridge
